<script>
const module={exports:{}};
function require(name){if(name!=='obsidian')throw Error('Unsupported require '+name);return mock;}
class TAbstractFile {constructor(path){this.path=path;}}
class TFile extends TAbstractFile {
 constructor(path,ctime){super(path);const name=path.split('/').pop();this.basename=name.replace(/\.[^.]+$/,'');
 this.extension=name.split('.').pop();this.parent={path:path.split('/').slice(0,-1).join('/')||'/'};
 this.stat={ctime:ctime||100,mtime:ctime||100,size:200};}
}
class TFolder extends TAbstractFile {}
class MarkdownRenderChild {
 constructor(el){this.containerEl=el;this.children=[];}
 load(){this.onload&&this.onload();}unload(){this.onunload&&this.onunload();}
 addChild(child){this.children.push(child);}removeChild(child){this.children=this.children.filter(x=>x!==child);}
}
class FileView {
 constructor(){this.contentEl=document.createElement('section');document.querySelector('#mount').append(this.contentEl);this.file=null;}
 async openFile(file){this.file=file;await this.onLoadFile(file);}
}
class Plugin {
 async loadData(){return null;} async saveData(){}
 registerView(type,callback){this.factory=callback;} registerExtensions(){}

}

class PluginSettingTab{};class Setting{}

 addItem(fn){const item={setTitle(title){this.title=title;return this;},onClick(cb){this.fn=cb;return this;}};fn(item);this.items.push(item);}
 showAtPosition(){window.__menu=this;}
}
class Modal {
 constructor(){this.contentEl=document.createElement('div');this.contentEl.className='modal-content';
 document.body.append(this.contentEl);}
 open(){this.contentEl.style.display='block';}close(){this.contentEl.remove();}
}
function setIcon(el,name) {
 const paths={'search':'M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14M16 16l5 5',
  'pencil':'M4 20l4-1 12-12-3-3L5 16l-1 4','ellipsis':'M5 12h.1M12 12h.1M19 12h.1',
  'bookmark':'M6 4h12v17l-6-4-6 4V4','bookmark-check':'M6 4h12v17l-6-4-6 4V4m3 6l2 2 4-4',
  'shuffle':'M16 3h5v5M4 20L21 3M16 16l5 5M21 16v5M4 4l5 5',
  'hash':'M5 9h14M4 15h14M11 3L7 21M17 3l-4 18',
  'chevron-down':'M6 9l6 6 6-6','chevron-right':'M9 6l6 6-6 6'};
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','18');svg.setAttribute('height','18');
 svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',paths[name]||paths.bookmark);
 svg.append(p);el.append(svg);
}
const mock={TAbstractFile,TFile,TFolder,MarkdownRenderChild,FileView,Plugin,Notice,Menu,Modal,
 PluginSettingTab,Setting,setIcon,
 getAllTags(cache){return [...(cache.tags||[]).map(x=>x.tag),...(cache.frontmatter?.tags||[]).map(x=>'#'+x)];},
 MarkdownRenderer:{async render(app,markdown,mount){
  const p=document.createElement('div');p.className='mock-native-markdown';
  p.textContent=markdown; p.style.whiteSpace='pre-wrap';mount.append(p);
 }}
};
HTMLElement.prototype.empty=function(){this.replaceChildren();};
HTMLElement.prototype.addClass=function(x){this.classList.add(x);};
HTMLElement.prototype.createDiv=function(){const x=document.createElement('div');this.append(x);return x;};
const files=new Map();
function put(path,body,time){
 const f=new TFile(path,time);
 f.stat.size=body.length;files.set(path,{file:f,body});return f;
}
const home=put('摘录/首页.excerpts','',100);
put('摘录/文学.md','# 摘录\n\n人不是为失败而生的，一个人可以被毁灭，但不能被打败。\n\n## 来源\n\n《老人与海》\n\n## 变种\n\n一个人可以失败，但不能放弃。\n\n## 批注\n\n这是一段关于意志的文字。',200);
put('摘录/生活.md','每一天都值得认真度过。\n\n## 阅读\n\n读到的一句话。',150);
put('摘录/图像.md','![[示例图片.png]]\n\n## 来源\n\n摄影随记',120);
const vault={
 getAbstractFileByPath(path){return files.get(path)?.file||null;},
 getFiles(){return [...files.values()].map(x=>x.file);},
 getMarkdownFiles(){return this.getFiles().filter(x=>x.extension==='md');},
 async read(f){return files.get(f.path).body;},async cachedRead(f){return files.get(f.path).body;},
 async process(f,transform){const item=files.get(f.path);item.body=transform(item.body);f.stat.size=item.body.length;f.stat.mtime++;},
 async createFolder() {},async create(path,raw){return put(path,raw,Date.now());},on(){return {};}
};
const app={vault,
 metadataCache:{getFileCache(file){
 const raw=files.get(file.path).body;
 return {tags:[],frontmatter:{tags:file.basename==='文学'?['文学','海明威']:file.basename==='生活'?['随想']:[]}};
 },on(){return {};}},
 fileManager:{async processFrontMatter(){}},
 workspace:{getLeaf(){return {async openFile(){},async setViewState(){}};},async revealLeaf(){}}
};
</script><script>/*__EXCERPTS_BUNDLE__*/</script><script>
(async()=>{
  const Excerpts=module.exports;const plugin=new Excerpts();plugin.app=app;
  await plugin.onload();const pane=plugin.factory({});await pane.openFile(home);
  window.__plugin=plugin;window.__pane=pane;
  await new Promise(resolve=>setTimeout(resolve,250));
  window.__ready=true;
})().catch(error=>{window.__error=String(error);console.error(error);});
