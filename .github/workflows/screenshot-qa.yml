name: Screenshot QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium:
    name: Visual inventory and layout guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-audit --no-fund && npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Existing layout constraints
        run: python scripts/spacing-check.py
      - name: Existing screenshot and interaction coverage
        run: python scripts/visual-check.py
      - name: Component-state screenshot inventory and geometry guards
        run: python scripts/visual-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excerpts-screenshot-qa
          path: |
            artifacts/**/*.png
            artifacts/**/*.json
            artifacts/*.png
            preview-current.html
          retention-days: 30
