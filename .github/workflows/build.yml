name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Prepare plugin
        run: |
          mkdir -p dist/excerpts
          cp main.js manifest.json styles.css dist/excerpts/
          cd dist && zip -r excerpts-0.1.0.zip excerpts
      - uses: actions/upload-artifact@v4
        with:
          name: excerpts-obsidian-plugin
          path: |
            dist/excerpts-0.1.0.zip
            dist/excerpts/main.js
            dist/excerpts/manifest.json
            dist/excerpts/styles.css
          retention-days: 30
