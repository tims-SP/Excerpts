name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Install Chromium for v4 browser acceptance
        run: |
          python -m pip install --quiet playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Audit every homepage, capture, H2, editor and tag state
        run: python scripts/visual-acceptance-v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excerpts-visual-qa
          path: artifacts/visual-v4/*.png
          retention-days: 7
      - name: Prepare plugin
        run: |
          mkdir -p dist/excerpts
          cp main.js manifest.json styles.css dist/excerpts/
          VERSION=$(node -p "require('./manifest.json').version")
          cd dist && zip -r "excerpts-${VERSION}.zip" excerpts
      - name: Package source snapshot for isolated rebuilds
        run: |
          tar -czf dist/excerpts-source-snapshot.tar.gz \
            src tests scripts docs .github/workflows \
            README.md LICENSE package.json esbuild.config.mjs \
            tsconfig.json tsconfig.offline.json manifest.json styles.css versions.json types-offline
      - uses: actions/upload-artifact@v4
        with:
          name: excerpts-source-snapshot
          path: dist/excerpts-source-snapshot.tar.gz
          retention-days: 7
      - name: Package build dependencies
        run: tar -czf dist/excerpts-deps-linux-node22.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: excerpts-dev-deps
          path: dist/excerpts-deps-linux-node22.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: excerpts-obsidian-plugin
          path: |
            dist/excerpts-*.zip
            dist/excerpts/main.js
            dist/excerpts/manifest.json
            dist/excerpts/styles.css
          retention-days: 30
