# Temporary dependency snapshot generator. Delete after lockfile is committed.
name: Bootstrap lockfile (temporary)
on:
  push:
    branches: [chore/production-g0-g1]
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency versions and print a transport-safe snapshot
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of Object.keys(pkg.devDependencies)) {
            const version = lock.packages?.['node_modules/' + name]?.version;
            if (!version || !/^\d+\.\d+\.\d+/.test(version)) throw Error('Unresolved direct dependency ' + name);
            pkg.devDependencies[name] = version;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          cp.execFileSync('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { stdio: 'inherit' });
          for (const name of ['package.json', 'package-lock.json']) {
            const base64 = Buffer.from(fs.readFileSync(name)).toString('base64');
            console.log('SNAP_BEGIN:' + name + ':' + base64.length);
            for (let pos = 0, seq = 0; pos < base64.length; pos += 2048, seq++) {
              console.log('SNAP_CHUNK:' + name + ':' + String(seq).padStart(5,'0') + ':' + base64.slice(pos, pos + 2048));
            }
            console.log('SNAP_END:' + name);
          }
          NODE
