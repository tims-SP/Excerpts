name: Repository performance baseline
on:
  pull_request:
    paths:
      - 'scripts/bench-vault.cjs'
      - '.github/workflows/performance.yml'
      - 'src/repository.ts'
      - 'src/codec.ts'
      - 'src/model.ts'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  file-backed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        count: [1000, 10000, 30000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Measure file-backed repository path
        run: |
          node --expose-gc scripts/bench-vault.cjs ${{ matrix.count }} artifacts/performance/vault-${{ matrix.count }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-repository-${{ matrix.count }}
          path: artifacts/performance/vault-${{ matrix.count }}.json
          retention-days: 14
